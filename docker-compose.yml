services:
  ollama:
    image: ollama/ollama:latest
    container_name: promptpwned-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ../ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  ollama-init:
    image: ollama/ollama:latest
    container_name: promptpwned-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - "ollama pull llama3.2 && ollama run llama3.2 'Hola' >/dev/null 2>&1 || true"
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: promptpwned-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_SERVER_URL=http://ollama:11434
    volumes:
      - ./backend:/app/backend
    depends_on:
      ollama:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: promptpwned-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
